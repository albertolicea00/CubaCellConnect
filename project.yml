name: CubaCellConnect
options:
  bundleIdPrefix: com.cubacellconnect
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  CubaCellConnect:
    type: application
    platform: iOS
    sources:
      - CubaCellConnect
      - Shared
    info:
      path: CubaCellConnect/Info.plist
      properties:
        CFBundleDisplayName: CubaCell Connect
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationQueriesSchemes:
          - tel
          - telprompt
        NSContactsUsageDescription: Para mostrar tus contactos y llamarlos directamente desde la app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cubacellconnect.app
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: CubaCellConnect/CubaCellConnect.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cubacellconnect.shared
    dependencies:
      - target: CallerIDExtension
        embed: true
    scheme:
      testTargets: []

  CallerIDExtension:
    type: app-extension
    platform: iOS
    sources:
      - CallerIDExtension
      - Shared
    info:
      path: CallerIDExtension/Info.plist
      properties:
        CFBundleDisplayName: CallerID
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cubacellconnect.app.CallerIDExtension
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: NO
    entitlements:
      path: CallerIDExtension/CallerIDExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cubacellconnect.shared
